---
upgrade:
  - |
    Deploy this middleware ordering change together with the
    ``keystone-extensions`` Lifesaver implementation supporting
    ``phase=pre_auth`` and request-local accounting ownership. S3 and EC2
    credential validation uses ``[lifesaver] token_cost``, whose default
    charges 10 credits for a missing access key (HTTP 404).
fixes:
  - |
    Repeated S3/EC2 credential failures from misconfigured scripts can now
    be rejected before caller-token validation and credential lookup.
    Lifesaver runs after URL normalization and retains its authenticated
    phase for other APIs. Each admitted request is accounted once, and
    downstream responses are preserved even if concurrent requests exhaust
    the subject's credit. Shared throttling remains dependent on Memcached;
    cache failures continue to fail open.
